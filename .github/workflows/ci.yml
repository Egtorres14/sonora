name: CI

on:
  pull_request:
  # Incluye main: los commits directos a la rama principal también pasan por las pruebas de navegador.
  push:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E (Chromium)
        run: |
          npx playwright install chromium --only-shell --with-deps
          npm run test:e2e
