name: Validar corpus y publicar modelo comunitario

# Cada vez que cambia el corpus (o a mano), entrena el modelo local con el mismo código de la app
# sobre public/corpus/coleccion.json + corpus/contributions/*.json, publica la tabla de validación y el
# modelo entrenado como assets de la release "modelo-comunitario". Nada se inventa: las cifras salen
# de particiones separadas por grabación de origen.

on:
  push:
    branches: [main]
    paths: ['corpus/**', 'public/corpus/coleccion.json', 'services/learning/**', 'services/audio/**', 'scripts/corpus/**', 'scripts/contrib/**']
  pull_request:
    paths: ['corpus/**', 'public/corpus/coleccion.json', 'services/learning/**', 'services/audio/**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  entrenar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Entrenar y validar
        # --out escribe el modelo donde la aplicación lo descarga (services/corpus.ts).
        run: npx tsx scripts/contrib/train-community.ts public/corpus/coleccion.json corpus/contributions/*.json --out public/corpus/modelo.json
      - name: Resumen
        run: cat corpus-out/VALIDACION-CI.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comentar en el PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file corpus-out/VALIDACION-CI.md
      - name: Publicar modelo comunitario
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view modelo-comunitario >/dev/null 2>&1 || gh release create modelo-comunitario --title "Modelo comunitario" --notes "Modelo local entrenado en CI con el corpus del repositorio. Se actualiza automáticamente."
          gh release upload modelo-comunitario corpus-out/community-model.json corpus-out/VALIDACION-CI.md --clobber

      # Sin este paso el modelo entrenado se queda en la release y la aplicación sigue sirviendo el anterior.
      # No basta con `git diff`: trainedAt cambia en cada ejecución, y cada push acababa generando un
      # commit del bot que hacía rechazar el siguiente. Se compara la huella de lo que importa.
      - name: Actualizar el modelo que descarga la aplicación
        if: github.event_name != 'pull_request'
        run: |
          git show HEAD:public/corpus/modelo.json > corpus-out/modelo-anterior.json 2>/dev/null || : > corpus-out/modelo-anterior.json
          set +e
          npx tsx scripts/contrib/model-changed.ts corpus-out/modelo-anterior.json public/corpus/modelo.json
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            git checkout -- public/corpus/modelo.json
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/corpus/modelo.json
          git commit -m "Modelo comunitario reentrenado con el corpus actual"
          git push origin HEAD:main
